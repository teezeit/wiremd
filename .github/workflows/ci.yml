name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm turbo run build

    - name: Run type check
      run: pnpm turbo run typecheck

    - name: Run linter
      run: pnpm turbo run lint

    - name: Run tests
      run: pnpm turbo run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests with coverage
      run: |
        pnpm --filter @eclectic-ai/wiremd build
        pnpm --filter @eclectic-ai/wiremd test:coverage -- --reporter=default --reporter=junit --outputFile=junit.xml
        pnpm --filter wiremd-editor test:coverage -- --reporter=default --reporter=junit --outputFile=junit.xml
        pnpm --filter wiremd-figma-plugin test:coverage -- --reporter=default --reporter=junit --outputFile=junit.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/core/coverage/lcov.info,./apps/editor/coverage/lcov.info,./extensions/figma/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/core/junit.xml,./apps/editor/junit.xml,./extensions/figma/junit.xml
        fail_ci_if_error: false

  lint-package:
    name: Lint Package
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build package
      run: pnpm --filter @eclectic-ai/wiremd run build

    - name: Pack package
      run: cd packages/core && npm pack

    - name: Check package contents
      run: tar -tzf packages/core/wiremd-*.tgz | head -20
