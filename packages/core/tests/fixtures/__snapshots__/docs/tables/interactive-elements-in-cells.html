<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wiremd Mockup</title>
  
</head>
<body class="wmd-root wmd-clean">
  <table class="wmd-table">
  <thead>
    <tr>
      <th class="wmd-table-cell wmd-align-left">Select</th>
    <th class="wmd-table-cell wmd-align-left">Name</th>
    <th class="wmd-table-cell wmd-align-left">Role</th>
    <th class="wmd-table-cell wmd-align-left">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr>
    <td class="wmd-table-cell wmd-align-left"><label class="wmd-checkbox">
    <input type="checkbox" />
    <span></span>
  </label></td>
    <td class="wmd-table-cell wmd-align-left">Alice</td>
    <td class="wmd-table-cell wmd-align-left"><select class="wmd-select">
    <option value="" disabled selected>Admin</option>
    
  </select></td>
    <td class="wmd-table-cell wmd-align-left"><button class="wmd-button">Edit</button><button class="wmd-button wmd-button-danger">Delete</button></td>
  </tr>
    <tr>
    <td class="wmd-table-cell wmd-align-left"><label class="wmd-checkbox">
    <input type="checkbox" checked />
    <span></span>
  </label></td>
    <td class="wmd-table-cell wmd-align-left">Bob</td>
    <td class="wmd-table-cell wmd-align-left"><select class="wmd-select">
    <option value="" disabled selected>Editor</option>
    
  </select></td>
    <td class="wmd-table-cell wmd-align-left"><button class="wmd-button wmd-button-primary">Edit</button><button class="wmd-button wmd-button-danger">Delete</button></td>
  </tr>
    <tr>
    <td class="wmd-table-cell wmd-align-left"><label class="wmd-checkbox">
    <input type="checkbox" />
    <span></span>
  </label></td>
    <td class="wmd-table-cell wmd-align-left">Carol</td>
    <td class="wmd-table-cell wmd-align-left"><select class="wmd-select">
    <option value="" disabled selected>Viewer</option>
    
  </select></td>
    <td class="wmd-table-cell wmd-align-left"><button class="wmd-button">Edit</button><button class="wmd-button wmd-button-danger">Delete</button></td>
  </tr>
  </tbody>
</table>
  
  
</body>
</html>
